<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Italo - Kontakt</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <!-- Sidhuvud med huvudnavigation.-->
    <header class="site-header">
        <a href="index.html" class="logo">Radio Italo</a>
        <button class="menu" type="button" aria-label="Öppna meny" aria-expanded="false" aria-controls="main-nav">☰</button>
        <nav id="main-nav" aria-label="Huvudnavigation">
            <ul class="list">
                <li>
                    <a href="index.html">Start</a>
                </li>
                <li>
                    <a href="upptack.html">Upptäck</a>
                </li>
                <li>
                    <a href="kontakt.html" aria-current="page">Kontakt</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <!--Kontaktformulär-->
        <section class="contact">
            <h1>Kontakta oss</h1>
            <p>Har du ett låttips eller en fråga till oss? Hör gärna av dig via formuläret nedan.</p>
            <form id="contact-form">
                <label for="name">Namn:</label>
                <input type="text" id="name" name="name">
                <label for="email">E-post:</label>
                <input type="email" id="email" name="email">
                <label for="message">Fråga:</label>
                <textarea type="message" id="message" name="message" rows="5"></textarea>
                <button type="submit">Skicka</button>
        </section>
    </main>
    
</body>
</html>
